name: Deploy edgetunnel (on upstream update)

on:
  workflow_dispatch:
  schedule:
    # 注意: schedule 只对默认分支(myset)上的 workflow 生效
    - cron: "0 0 * * *" # every day

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout myset (full history)
        uses: actions/checkout@v4
        with:
          ref: myset
          fetch-depth: 0

      - name: Check upstream has new commits
        id: check
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main
          # 若 upstream/main 已是 myset 的祖先 => myset 已包含上游全部提交, 无更新
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream already contained in myset, no update, skip deploy"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream has new commits, will deploy"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Switch to upstream main, overlay myset (no commit, no push)
        if: steps.check.outputs.updated == 'true'
        run: bash .github/scripts/merge_myset.sh

      - name: Deploy with wrangler
        if: steps.check.outputs.updated == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
